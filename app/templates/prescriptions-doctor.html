{% extends 'base.html' %}
{% block content %}

<h1>MedLoop</h1>

<h2>File a Prescription</h2>

<form method="POST">
    <label for="pid">Select Patient:</label>
    <select name="pid" id="pid" required>
        {% for patient in patients %}
            <option value="{{ patient.pid }}">
                {{ patient.fname }} {{ patient.lname }} - Patient ID: {{ patient.pid }}
            </option>
        {% endfor %}
    </select>

    <br><br>

    <label for="mid">Select Medication:</label>
    <select name="mid" id="mid" required>
        {% for med in medications %}
            <option value="{{ med.mid }}">
                {{ med.name }} - {{ med.dosage }} - {{ med.description }}
            </option>
        {% endfor %}
    </select>

    <br><br>

    <button type="submit">File Prescription</button>
</form>

<p><a href="/">Back to Home</a></p>

{% endblock content %}
