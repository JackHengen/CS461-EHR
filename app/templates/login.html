<!doctype html>
<html>
    <head>
        <title>MedLoop</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body style="margin:0;">
        <div style="display:flex; width:100vw; height:100vh;">
            <div style="width:50%; height:100%; overflow:hidden; display:flex; flex-direction:column;
                background-color: var(--{{'doctor-dark' if doctor else 'patient-dark'}});">
                <div style="height:25%; display:flex; align-items:center; justify-content:center;">
                    <h2 style="font-weight: normal;">Welcome back</h2>
                </div>
                <img src="{{
                        url_for('static',filename='blue-flower.png')
                        if doctor else
                        url_for('static',filename='orange-flower.png')
                }}" style="height:75%; object-fit:contain;">
            </div>
            <div style="width:50%; height:100%; overflow:hidden; display:flex; flex-direction:column;">
                <div style="padding-top: 20vh; display:flex; flex-direction:column; align-items:center;">
                    <h1 style="margin-bottom: 0;">MedLoop</h1>
                    <p>{{ 'Doctor Login' if doctor else 'Patient Login' }}</p>
                </div>


                <form method="post" action="{{ '/doctor-login' if doctor else '/patient-login' }}"
                    style="display: flex; flex-direction:column; align-items:center;">
                    {% for message in get_flashed_messages() %}
                        <div class="flash">{{ message }}</div>
                    {% endfor %}
                    <div style="margin: 1%;">
                        <label for="firstname">First Name:</label>
                        <input type="text" id="firstname" name="firstname">
                    </div>

                    <div style="margin: 1%;">
                        <label for="lastname">Last Name:</label>
                        <input type="text" id="lastname" name="lastname">
                    </div>

                    <div style="margin: 1%;">
                        <label for="password">Password: </label>
                        <input type="password" id="password" name="password">
                    </div>

                    <button type="submit">Log in</button>
                </form>
                
                <div style="margin-top: 5%; display:flex; justify-content: center; gap: 2%;">
                    <span> Go to: </span>
                        <a href="/patient-login">Patient Login</a>
                        <a href="/doctor-login">Doctor Login</a>
                        <a href="/patient-onboard">Patient Onboarding</a>
                </div>

            </div>
        </div>
    </body>
</html>
